name: Build and Quality

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify without external databases
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode -DexcludedGroups=integration -Djacoco.skip=true clean verify

      - name: Verify without external databases on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode "-DexcludedGroups=integration" "-Djacoco.skip=true" clean verify

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create ephemeral database credentials
        run: |
          password="AgtySql_CI_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_aA1!"
          echo "AGTY_SQL_MYSQL_PASSWORD=${password}" >> "$GITHUB_ENV"
          echo "AGTY_SQL_MYSQL_ROOT_PASSWORD=Root_${password}" >> "$GITHUB_ENV"
          echo "AGTY_SQL_MARIADB_PASSWORD=${password}" >> "$GITHUB_ENV"
          echo "AGTY_SQL_MARIADB_ROOT_PASSWORD=Root_${password}" >> "$GITHUB_ENV"
          echo "AGTY_SQL_PGSQL_PASSWORD=${password}" >> "$GITHUB_ENV"
          echo "AGTY_SQL_MSSQL_PASSWORD=${password}" >> "$GITHUB_ENV"

      - name: Start integration databases
        run: |
          cp config.ini-sample config.ini
          mkdir -p databases/sqlite databases/h2
          ./install/install-mysql.sh
          ./install/install-mariadb.sh
          ./install/install-pgsql.sh
          ./install/install-mssql.sh

      - name: Run full release gates with all databases
        run: package/check-api-compatibility.sh

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run JMH smoke benchmarks
        run: package/run-benchmarks.sh smoke

      - name: Upload JMH result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jmh-smoke-java-21
          path: benchmarks/target/jmh-smoke.json
          if-no-files-found: error

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        run: bash -n install/*.sh package/*.sh

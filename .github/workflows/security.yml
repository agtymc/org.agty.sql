name: Dependency Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: v2.4.0
      OSV_SCANNER_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate dependency SBOM
        run: ./mvnw --batch-mode -DskipTests package

      - name: Install verified OSV-Scanner
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            --output /tmp/osv-scanner
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum --check
          chmod 755 /tmp/osv-scanner

      - name: Scan all Maven dependencies
        run: >-
          /tmp/osv-scanner scan source
          --lockfile=target/bom.json
          --format=json
          --output-file=target/osv-results.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-reports
          path: |
            target/bom.json
            target/bom.xml
            target/osv-results.json
          if-no-files-found: ignore

name: Dependency Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: v2.4.0
      OSV_SCANNER_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate dependency SBOM
        run: ./mvnw --batch-mode -DskipTests package

      - name: Install verified OSV-Scanner
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            --output /tmp/osv-scanner
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum --check
          chmod 755 /tmp/osv-scanner

      - name: Scan all Maven dependencies
        run: >-
          /tmp/osv-scanner scan source
          --lockfile=target/bom.json
          --format=json
          --output-file=target/osv-results.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-reports
          path: |
            target/bom.json
            target/bom.xml
            target/osv-results.json
          if-no-files-found: ignore

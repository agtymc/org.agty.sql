name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: v${{ inputs.version }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: org.agty.sql
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify signed tag and release metadata
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          test "$(git rev-list -n 1 "${tag}")" = "$(git rev-parse HEAD)"
          test "$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" = "${VERSION}"
          test "$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' src/main/java/org/agty/sql/AgtySQL.java)" = "${VERSION}"
          test "$(./mvnw -f benchmarks/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)" = "${VERSION}"
          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.type)"
          test "${tag_type}" = "tag"
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .verification.verified)" = "true"
          grep -Fq "## ${VERSION} -" CHANGELOG.md
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists" >&2
            exit 1
          fi

      - name: Build and verify release artifacts once
        run: >-
          package/check-api-compatibility.sh
          -DexcludedGroups=integration
          -Djacoco.skip=true

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          cp pom.xml "target/org-agty-sql-${VERSION}.pom"
          awk -v version="${VERSION}" '
            $0 ~ "^## " version " -" {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > target/RELEASE_NOTES.md
          artifacts=(
            "target/org-agty-sql-${VERSION}.jar"
            "target/org-agty-sql-${VERSION}-sources.jar"
            "target/org-agty-sql-${VERSION}-javadoc.jar"
            "target/org-agty-sql-${VERSION}.pom"
            "target/bom.json"
            "target/bom.xml"
            "config.ini-sample"
          )
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}"
          done
          sha256sum "${artifacts[@]}" > target/SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: target/SHA256SUMS

      - name: Upload verified workflow bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: org-agty-sql-${{ inputs.version }}-release
          path: |
            target/org-agty-sql-${{ inputs.version }}.jar
            target/org-agty-sql-${{ inputs.version }}-sources.jar
            target/org-agty-sql-${{ inputs.version }}-javadoc.jar
            target/org-agty-sql-${{ inputs.version }}.pom
            target/bom.json
            target/bom.xml
            target/SHA256SUMS
            target/RELEASE_NOTES.md
            config.ini-sample
          if-no-files-found: error

      - name: Publish the verified bytes to GitHub Packages
        run: |
          ./mvnw --batch-mode org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -DrepositoryId=org.agty.sql \
            -Durl=https://maven.pkg.github.com/agtymc/org.agty.sql \
            -Dfile="target/org-agty-sql-${VERSION}.jar" \
            -DpomFile="target/org-agty-sql-${VERSION}.pom" \
            -Dfiles="target/org-agty-sql-${VERSION}-sources.jar,target/org-agty-sql-${VERSION}-javadoc.jar,target/bom.json,target/bom.xml" \
            -Dclassifiers=sources,javadoc,cyclonedx,cyclonedx \
            -Dtypes=jar,jar,json,xml \
            -DgeneratePom=false

      - name: Create GitHub release from the same files
        run: |
          gh release create "v${VERSION}" \
            "target/org-agty-sql-${VERSION}.jar" \
            "target/org-agty-sql-${VERSION}-sources.jar" \
            "target/org-agty-sql-${VERSION}-javadoc.jar" \
            "target/org-agty-sql-${VERSION}.pom" \
            target/bom.json \
            target/bom.xml \
            target/SHA256SUMS \
            config.ini-sample \
            --verify-tag \
            --title "org.agty.sql ${VERSION}" \
            --notes-file target/RELEASE_NOTES.md
